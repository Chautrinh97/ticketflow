openapi: 3.0.3
info:
  title: TicketFlow — Notification Service API
  description: >
    Danh sách & trạng thái đọc thông báo in-app. Notification Service là consumer
    thuần tuý của event nội bộ (xem docs/01-architecture/event-driven-design.md) —
    API này chỉ phục vụ đọc thông báo, không có endpoint "gửi thông báo" công khai.
    Xem spec nghiệp vụ tại docs/02-domains/notification/spec.md.
  version: "1.0.0"
servers:
  - url: /api/v1
tags:
  - name: notifications

paths:
  /users/me/notifications:
    get:
      tags: [notifications]
      summary: Danh sách thông báo của user hiện tại
      parameters:
        - name: is_read
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  total:
                    type: integer

  /users/me/notifications/{id}/read:
    patch:
      tags: [notifications]
      summary: Đánh dấu một thông báo đã đọc — chỉ thông báo thuộc chính user gọi
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Đã đánh dấu đã đọc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "403":
          description: Thông báo không thuộc user hiện tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Không tìm thấy thông báo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: "vd: order.created | payment.success | ticket.issued | order.cancelled | event.reminder"
        title:
          type: string
        body:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

security:
  - bearerAuth: []
